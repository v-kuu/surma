name: Vulnerability scan

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  vuln-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OSV-Scanner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip
          curl -L https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
               -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.72.0

      - name: Install Conan
        run: pip3 install conan

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Scan
        run: make vuln-scan
